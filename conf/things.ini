[mqtt]
enabled=true
url=mqtt://127.0.0.1:1883
client_id=
node_id=
username=
password=
keepalive=60
clean_session=true
connect_timeout=5
qos=1
rpc_timeout=10
shared_group=
status_topic=devices/{deviceId}/status
state_reported_topic=devices/{deviceId}/state/reported
state_desired_topic=devices/{deviceId}/state/desired
metrics_topic=devices/{deviceId}/metrics
event_topic=devices/{deviceId}/event
rpc_request_topic=devices/{deviceId}/rpc/request
rpc_reply_topic=nexus/{nodeId}/rpc/reply

[event]
interval=60
medium=mqtt
max_duration=3600
min_duration=10

[rtc]
max_duration=3600
max_rate=10
